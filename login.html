<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Cool Media Remote Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="auth-page">
    <div class="auth-card">
      <a href="index.html" class="logo" style="justify-content:center;margin-bottom:28px;">
        <span class="brand">Cool Media</span>
        <span class="suffix">Remote Workspace</span>
      </a>

      <h1>Welcome back</h1>
      <p class="sub">Log in to view your projects and membership status.</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required />
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:0.85rem;">
          <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--accent-orange);" /> Remember me
          </label>
          <a href="#" style="color:var(--accent-orange);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
          Log in →
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p style="text-align:center;font-size:0.9rem;color:var(--text-secondary);">
        New to Cool Media Remote Workspace? <a href="signup.html" style="color:var(--accent-orange);font-weight:500;">Create an account</a>
      </p>
    </div>
  </div>
<script src="js/main.js"></script>
