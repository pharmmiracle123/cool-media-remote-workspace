<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Cool Media Remote Workspace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@300;400;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script>
    tailwind.config = {
      corePlugins: { preflight: false }, // keep the existing site styles untouched
      theme: { extend: { fontFamily: {
        mont: ['Montserrat', 'Inter', 'sans-serif'],
        inter: ['Inter', 'system-ui', 'sans-serif']
      } } }
    };
  </script>
</head>
<body>
  <canvas id="particle-canvas"></canvas>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <header class="brand-banner compact">
    <div class="w-full max-w-[720px] [container-type:inline-size]">
      <div class="relative w-full aspect-[1080/378]" role="img" aria-label="Cool Media Remote Workspace">
        <span class="absolute left-[6.2%] top-[29.9%] font-mont font-normal leading-none tracking-[-0.005em] text-white text-[length:9.45cqw]">COOL</span>
        <span class="absolute left-[35.3%] top-[35.8%] font-mont font-semibold leading-none tracking-[0.25em] text-[length:5.55cqw] text-transparent bg-clip-text bg-gradient-to-r from-[#ff8260] to-[#ffc547]">MEDIA</span>
        <span class="absolute left-[63.5%] top-[39.4%] font-inter font-normal leading-none text-[length:3.46cqw] text-[#ffd6e4] whitespace-nowrap">Remote Workspace</span>
        <span class="absolute left-[6.67%] top-[57.9%] h-[1.9%] w-[54%] rounded-full bg-gradient-to-r from-[#ff4191] via-[#ff796b] to-[#ffc546]"></span>
      </div>
    </div>
    <nav class="navbar">
      <div class="nav-inner">
        <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="membership.html">Membership</a>
        <a href="login.html" class="btn btn-ghost btn-sm active">Log in</a>
        <a href="signup.html" class="btn btn-primary btn-sm">Join</a>
        </div>
        <button class="nav-toggle" aria-label="Toggle menu" aria-expanded="false" type="button">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>
  </header>

  <div class="auth-page">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to view your projects and membership status.</p>

      <form id="login-form" class="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" placeholder="you@example.com" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Your password" required />
        </div>

        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;font-size:0.85rem;">
          <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;">
            <input type="checkbox" style="accent-color:var(--accent-orange);" /> Remember me
          </label>
          <a href="#" style="color:var(--accent-orange);">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;">
          Log in →
        </button>
      </form>

      <div class="auth-divider">or</div>

      <p style="text-align:center;font-size:0.9rem;color:var(--text-secondary);">
        New to Cool Media Remote Workspace? <a href="signup.html" style="color:var(--accent-orange);font-weight:500;">Create an account</a>
      </p>
    </div>
  </div>
<script src="js/main.js"></script>

</body>
</html>
